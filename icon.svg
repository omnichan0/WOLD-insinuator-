<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#13132a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Hexagon border -->
  <polygon points="256,64 408,152 408,360 256,448 104,360 104,152" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6"/>
  <!-- 8-pointed star (OMEGA symbol) -->
  <g transform="translate(256,256)">
    <!-- Outer star -->
    <path d="M0,-140 L30,-50 L120,-50 L50,10 L80,100 L0,50 L-80,100 L-50,10 L-120,-50 L-30,-50 Z" fill="url(#glow)" opacity="0.9"/>
    <!-- Inner glow -->
    <path d="M0,-140 L30,-50 L120,-50 L50,10 L80,100 L0,50 L-80,100 L-50,10 L-120,-50 L-30,-50 Z" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
    <!-- 8D text -->
    <text x="0" y="12" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" fill="#0a0a0f">8D</text>
  </g>
  <!-- Crossed weapons silhouette -->
  <g transform="translate(256,380)" opacity="0.7">
    <rect x="-80" y="-4" width="160" height="8" rx="4" fill="url(#glow)" transform="rotate(-30)"/>
    <rect x="-80" y="-4" width="160" height="8" rx="4" fill="url(#glow)" transform="rotate(30)"/>
  </g>
</svg>